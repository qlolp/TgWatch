name: Bug report
description: Describe observed behavior and how to reproduce it
body:
  - type: input
    id: version
    attributes:
      label: App version and source
      description: Include phone or Wear OS, version, and GitHub/F-Droid/local build.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android / Wear OS version and device
      description: Include API level if known. Do not include device identifiers.
  - type: textarea
    id: behavior
    attributes:
      label: Steps, expected behavior and actual behavior
      description: Include selected monitoring target, network class (Wi-Fi/mobile/VPN), and whether the result is stale.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional redacted diagnostics
      description: Use the in-app diagnostic export. Review it first. Do not attach tokens, webhook URLs, private service addresses, raw backups or unreviewed logs.
