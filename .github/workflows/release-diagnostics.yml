name: Read-only release diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify the failed release without exposing raw logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/qlolp/TgWatch/actions/jobs/117516805713/logs > "$RUNNER_TEMP/release-job.log"
          gh api repos/qlolp/TgWatch/actions/runs/39073404090/artifacts > "$RUNNER_TEMP/release-artifacts.json"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, io, json, os, re, subprocess, zipfile
          root = Path(os.environ['RUNNER_TEMP'])
          data = (root / 'release-job.log').read_bytes()
          if zipfile.is_zipfile(io.BytesIO(data)):
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  data = b'\n'.join(archive.read(name) for name in archive.namelist())
          text = data.decode('utf-8', errors='replace')
          def notice(value):
              print('::notice title=Release diagnostic::' + value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          notice('Log SHA256=' + hashlib.sha256(data).hexdigest())
          for match in re.finditer(r'(?:app|wear)/build/reports/(?:sbom/[A-Za-z0-9_.-]+|dependencies/resolved\.json)[^\r\n]{0,180}?differ: byte [0-9]+, line [0-9]+', text):
              value = match.group()
              if '::' not in value and not any(c in value for c in '<>{}'):
                  notice(value)
          for label, pattern in {
              'Gradle build failed': r'BUILD FAILED',
              'Missing signing variable': r'Missing (?:signing key|store password|alias|key password)',
              'Keystore credentials rejected': r'(?i)(?:password was incorrect|keystore was tampered|cannot recover key|failed to read key)',
              'APK input missing': r'(?i)(?:no such file|file not found|failed to open).*\.apk',
          }.items():
              if re.search(pattern, text): notice(label)
          classes = sorted(set(re.findall(r'\b(?:org\.gradle|com\.android|java\.(?:lang|io|security)|org\.jetbrains)\.[A-Za-z0-9_.$]{1,160}', text)))
          if classes: notice('Exception identifiers=' + ','.join(classes[-8:]))
          artifacts = json.loads((root / 'release-artifacts.json').read_text())['artifacts']
          for artifact in artifacts:
              if artifact['name'] not in ('sbom-reports', 'wear-sbom-reports'): continue
              result = subprocess.run(['gh','api','repos/qlolp/TgWatch/actions/artifacts/'+str(artifact['id'])+'/zip'],capture_output=True,check=True)
              with zipfile.ZipFile(io.BytesIO(result.stdout)) as archive:
                  for name in archive.namelist():
                      if Path(name).name not in ('TgWatch.sbom.cdx.json','TgWatch-wear.sbom.cdx.json'): continue
                      if archive.getinfo(name).file_size > 5 * 1024 * 1024: raise ValueError('Oversized SBOM')
                      bom = json.loads(archive.read(name))
                      core = [c for c in bom['components'] if c.get('group')=='ru.tgwatch' and c.get('name')=='probe-core']
                      notice(artifact['name'] + ' runtime count=' + str(len(bom['components'])))
                      for component in core:
                          digest = component['hashes'][0]['content']
                          if re.fullmatch('[0-9a-f]{64}',digest): notice(artifact['name'] + ' core SHA256=' + digest)
          PY
