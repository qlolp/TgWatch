name: Published 1.23 upgrade audit
on:
  push:
    branches: [verify/published-upgrade-123]
  workflow_dispatch:
permissions:
  contents: read
env:
  BUILD_TOOLS: "36.0.0"
jobs:
  published-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6bace393b6de0791eeab9616123cabce954a7f83
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android tools
        run: bash scripts/ensure-android-sdk.sh
      - name: Verify actual published production APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from apk_verification import verify_apk_identity, verify_checksum
          source = '6bace393b6de0791eeab9616123cabce954a7f83'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == source
          cert = 'ab74727a44f59684045e7db4c820be309f886433a18a3c06f3439417f3acbef1'
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools' / os.environ['BUILD_TOOLS']
          proof = {'source': source, 'apks': []}
          entries = [
              ('v1.22.2', 1022002, 'previous', 'ebb93c4272121945284b787ec9a245c91b15f3af7fecd045fada84cc3cb89f9d'),
              ('v1.23.0', 1023000, 'current', 'f13064de8893369d85392068bbb1ece02e8a38d6fec98c7e2265b7ec05b63379'),
          ]
          for tag, code, directory, expected in entries:
              release = json.loads(subprocess.check_output([
                  'gh', 'api', 'repos/qlolp/TgWatch/releases/tags/' + tag], timeout=30))
              assert release['tag_name'] == tag and not release['draft'] and not release['prerelease']
              folder = Path(directory)
              folder.mkdir()
              for name in ('TgWatch.apk', 'TgWatch.apk.sha256'):
                  assets = [a for a in release['assets'] if a['name'] == name]
                  assert len(assets) == 1
                  asset = assets[0]
                  destination = folder / name
                  with destination.open('wb') as output:
                      subprocess.run(['gh', 'api', '-H', 'Accept: application/octet-stream',
                          'repos/qlolp/TgWatch/releases/assets/' + str(asset['id'])],
                          stdout=output, check=True, timeout=120)
                  assert destination.stat().st_size == asset['size']
                  assert 'sha256:' + hashlib.sha256(destination.read_bytes()).hexdigest() == asset['digest']
              apk = folder / 'TgWatch.apk'
              assert verify_checksum(apk, folder / 'TgWatch.apk.sha256') == expected
              verify_apk_identity(apk, tag[1:], code, str(tools / 'aapt2'))
              signature = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--print-certs', str(apk)], text=True)
              assert re.findall(r'Signer #\d+ certificate SHA-256 digest: ([a-f0-9]{64})', signature) == [cert]
              proof['apks'].append({'tag': tag, 'code': code, 'sha256': expected, 'certificate': cert})
          Path('published-apk-verification.json').write_text(json.dumps(proof, indent=2))
          print('Exact published APKs, versions, hashes and production certificates verified')
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real published 1.22.2 to 1.23.0 upgrade without clearing data
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: >-
            bash -c 'set -euo pipefail;
            python3 scripts/adb-readiness.py --timeout 180;
            bash scripts/signed-upgrade-smoke.sh previous/TgWatch.apk current/TgWatch.apk'
      - name: Published upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: published-upgrade-1.22.2-to-1.23.0
          path: |
            published-apk-verification.json
            upgrade-*.xml
            upgrade-*.json
            signed-upgrade-logcat.txt
            release-screen.png
          if-no-files-found: error
