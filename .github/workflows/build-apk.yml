name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK and run tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TgWatch-apk
          path: app/build/outputs/apk/debug/*.apk

      # Кладём свежий APK в раздел Releases, чтобы его можно было скачать
      # прямо на телефон по постоянной ссылке .../releases/latest/download/TgWatch.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TgWatch.apk
          gh release delete build --yes --cleanup-tag || true
          gh release create build TgWatch.apk \
            --title "TG Монитор — последняя сборка" \
            --notes "Автоматическая сборка из ветки main. Скачай TgWatch.apk и установи на телефон." \
            --latest
