name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed release (requires signing secrets)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tgwatch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, Android lint and APKs
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease :app:dependencyInventory --no-daemon --stacktrace
      - name: Audit exact resolved dependencies against OSV
        run: |
          python3 scripts/test_dependency_audit.py
          python3 scripts/test_signing_keychain.py
          python3 scripts/dependency-audit.py app/build/reports/dependencies/resolved.json app/build/reports/dependencies/osv-report.json
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: app/build/reports/
      - name: Print lint diagnostics
        if: always()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          for key in ('tests', 'failures', 'errors', 'skipped'):
              print(f'{key}: {sum(int(s.get(key, 0)) for s in suites)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TgWatch-debug-test-only
          path: app/build/outputs/apk/debug/*.apk
      - name: Signing readiness
        env:
          SIGNING_READY: ${{ secrets.TGWATCH_KEYSTORE_BASE64 != '' && secrets.TGWATCH_KEYSTORE_PASSWORD != '' && secrets.TGWATCH_KEY_ALIAS != '' && secrets.TGWATCH_KEY_PASSWORD != '' }}
        run: |
          if [ "$SIGNING_READY" = true ]; then
            echo 'Production signing key configured.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Production signing is not configured. Run scripts/configure-signing.sh on a trusted machine; debug APKs are test-only.' >> "$GITHUB_STEP_SUMMARY"
          fi
  release:
    needs: [build, android]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with persistent signing key
        env:
          TGWATCH_KEYSTORE_BASE64: ${{ secrets.TGWATCH_KEYSTORE_BASE64 }}
          TGWATCH_KEYSTORE_PASSWORD: ${{ secrets.TGWATCH_KEYSTORE_PASSWORD }}
          TGWATCH_KEY_ALIAS: ${{ secrets.TGWATCH_KEY_ALIAS }}
          TGWATCH_KEY_PASSWORD: ${{ secrets.TGWATCH_KEY_PASSWORD }}
          TGWATCH_KEYSTORE_PATH: ${{ runner.temp }}/tgwatch-release.p12
        run: |
          set -euo pipefail
          : "${TGWATCH_KEYSTORE_BASE64:?Missing signing key}"
          : "${TGWATCH_KEYSTORE_PASSWORD:?Missing store password}"
          : "${TGWATCH_KEY_ALIAS:?Missing alias}"
          : "${TGWATCH_KEY_PASSWORD:?Missing key password}"
          trap 'rm -f "$TGWATCH_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$TGWATCH_KEYSTORE_BASE64" | base64 --decode > "$TGWATCH_KEYSTORE_PATH"
          bash ./gradlew assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk TgWatch.apk
          sha256sum TgWatch.apk > TgWatch.apk.sha256
      - name: Verify signing continuity with published 1.9.40
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.9.40 --repo "$GITHUB_REPOSITORY" --pattern TgWatch.apk --dir previous
          python3 - <<'PY'
          import hashlib, pathlib
          assert hashlib.sha256(pathlib.Path('previous/TgWatch.apk').read_bytes()).hexdigest() == 'dd3d017d9cc4a9f8a37a202c70520e8ecd4e30646e32c5effb841b08b6c8036e'
          PY
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --print-certs previous/TgWatch.apk > previous-signature.txt
          "$signer" verify --print-certs TgWatch.apk > release-signature.txt
          diff <(grep 'Signer #1 certificate SHA-256 digest:' previous-signature.txt) <(grep 'Signer #1 certificate SHA-256 digest:' release-signature.txt)
      - name: Enable KVM for signed upgrade
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade the real signed release without clearing data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash scripts/signed-upgrade-smoke.sh previous/TgWatch.apk TgWatch.apk
      - name: Signed upgrade reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-upgrade-reports
          path: |
            signed-upgrade-logcat.txt
            upgrade-*.xml
            upgrade-*.csv
            release-screen.png
      - name: Download audited dependency reports
        uses: actions/download-artifact@v4
        with:
          name: quality-reports
          path: release-quality
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*versionName = "\([0-9.]*\)".*/\1/p' app/build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]
          gh release create "v${version}.${GITHUB_RUN_NUMBER}" TgWatch.apk TgWatch.apk.sha256 \
            release-quality/dependencies/runtime.cdx.json release-quality/dependencies/osv-report.json \
            --target "$GITHUB_SHA" --title "TG Монитор ${version}.${GITHUB_RUN_NUMBER}" \
            --notes-file "docs/releases/${version}.md" --latest
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash scripts/android-smoke.sh
      - name: Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            smoke-logcat.txt
