name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed release (requires signing secrets)
        type: boolean
        default: false
permissions:
  contents: read
env:
  BUILD_TOOLS: "35.0.0"
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # A push may cancel older push checks, never a manual publication's checks.
      group: tgwatch-check-build-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Legacy wrapper regressions inspect the immutable historical commit.
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Release policy regression tests
        run: |
          python3 scripts/lock-requirements.py --check scripts/requirements-release.txt scripts/requirements-release.lock
          python3 -m pip install --require-hashes -r scripts/requirements-release.lock
          python3 scripts/report-python-tests.py
          python3 scripts/test_dependency_audit.py
          python3 scripts/test_signing_keychain.py
      - name: Unit tests, Android lint and APKs
        run: bash ./gradlew detekt testDebugUnitTest lintDebug assembleDebug assembleRelease dependencyInventory generateReleaseSbom --no-daemon --stacktrace
      - name: Audit all exact resolved runtime and test dependencies against OSV
        run: python3 scripts/dependency-audit.py app/build/reports/dependencies/resolved.json app/build/reports/dependencies/osv-report.json
      - name: Install pinned Trivy scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.75.0
      - name: Gate release runtime SBOM on HIGH and CRITICAL vulnerabilities
        run: bash scripts/scan-sbom.sh app/build/reports/sbom/TgWatch.sbom.cdx.json app/build/reports/sbom/TgWatch.trivy.json
      - name: SBOM and vulnerability scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-reports
          path: |
            app/build/reports/sbom/TgWatch.sbom.cdx.json
            app/build/reports/sbom/TgWatch.trivy.json
            app/build/reports/sbom/TgWatch.trivy.status.json
            app/build/reports/sbom/TgWatch.trivy.log
      - name: Resolved dependency graphs and OSV audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-reports
          path: |
            app/build/reports/dependencies/resolved.json
            app/build/reports/dependencies/osv-report.json
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: app/build/reports/
      - name: Print lint diagnostics
        if: always()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          for key in ('tests', 'failures', 'errors', 'skipped'):
              print(f'{key}: {sum(int(s.get(key, 0)) for s in suites)}')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TgWatch-debug-test-only
          path: app/build/outputs/apk/debug/*.apk
      - name: Signing readiness
        env:
          SIGNING_READY: ${{ secrets.TGWATCH_KEYSTORE_BASE64 != '' && secrets.TGWATCH_KEYSTORE_PASSWORD != '' && secrets.TGWATCH_KEY_ALIAS != '' && secrets.TGWATCH_KEY_PASSWORD != '' }}
        run: |
          if [ "$SIGNING_READY" = true ]; then
            echo 'Production signing key configured.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Production signing is not configured. Use scripts/configure-signing.sh with the existing production backup on a trusted Mac. It never creates a replacement key; debug APKs are test-only.' >> "$GITHUB_STEP_SUMMARY"
          fi
  release:
    needs: [build, android]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      # Serial across version tags and manual publications; checks have separate groups.
      group: tgwatch-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source tag, main ancestry and monotonic publication before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/lock-requirements.py --check scripts/requirements-release.txt scripts/requirements-release.lock
          python3 -m pip install --require-hashes -r scripts/requirements-release.lock
          python3 scripts/release-policy.py --repo "$GITHUB_REPOSITORY" \
            --sha "$(git rev-parse HEAD)" --ref "$GITHUB_REF" --preflight
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Ensure pinned Android build tools
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          if [ ! -x "$tools/apksigner" ] || [ ! -x "$tools/aapt2" ]; then
            sdkmanager --install "build-tools;$BUILD_TOOLS"
          fi
          test -x "$tools/apksigner"
          test -x "$tools/aapt2"
      - name: Download this run's successful SBOM scan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-reports
          path: release-evidence
      - name: Download this run's full dependency audit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-reports
          path: release-dependencies
      - name: Validate scan evidence
        run: |
          python3 scripts/lock-requirements.py --check scripts/requirements-release.txt scripts/requirements-release.lock
          python3 -m pip install --require-hashes -r scripts/requirements-release.lock
          python3 scripts/verify-audit-evidence.py \
            --sbom release-evidence/TgWatch.sbom.cdx.json --trivy release-evidence/TgWatch.trivy.json \
            --status release-evidence/TgWatch.trivy.status.json \
            --inventory release-dependencies/resolved.json --osv release-dependencies/osv-report.json
      - name: Build with persistent signing key
        id: signed
        env:
          TGWATCH_KEYSTORE_BASE64: ${{ secrets.TGWATCH_KEYSTORE_BASE64 }}
          TGWATCH_KEYSTORE_PASSWORD: ${{ secrets.TGWATCH_KEYSTORE_PASSWORD }}
          TGWATCH_KEY_ALIAS: ${{ secrets.TGWATCH_KEY_ALIAS }}
          TGWATCH_KEY_PASSWORD: ${{ secrets.TGWATCH_KEY_PASSWORD }}
          TGWATCH_KEYSTORE_PATH: ${{ runner.temp }}/tgwatch-release.p12
        run: |
          set -euo pipefail
          : "${TGWATCH_KEYSTORE_BASE64:?Missing signing key}"
          : "${TGWATCH_KEYSTORE_PASSWORD:?Missing store password}"
          : "${TGWATCH_KEY_ALIAS:?Missing alias}"
          : "${TGWATCH_KEY_PASSWORD:?Missing key password}"
          trap 'rm -f "$TGWATCH_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$TGWATCH_KEYSTORE_BASE64" | base64 --decode > "$TGWATCH_KEYSTORE_PATH"
          bash ./gradlew assembleRelease generateReleaseSbom --no-daemon
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk TgWatch.apk
          sha256sum TgWatch.apk > TgWatch.apk.sha256
          echo "apk_sha256=$(cut -d' ' -f1 TgWatch.apk.sha256)" >> "$GITHUB_OUTPUT"
          cmp app/build/reports/sbom/TgWatch.sbom.cdx.json release-evidence/TgWatch.sbom.cdx.json
          cmp app/build/reports/dependencies/resolved.json release-dependencies/resolved.json
          cp release-evidence/TgWatch.sbom.cdx.json TgWatch.sbom.cdx.json
          cp release-evidence/TgWatch.trivy.json TgWatch.trivy.json
          cp release-dependencies/resolved.json TgWatch.dependencies.json
          cp release-dependencies/osv-report.json TgWatch.osv.json
      - name: Verify signing continuity with immutable published 1.10.47
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.10.47 --repo "$GITHUB_REPOSITORY" --pattern TgWatch.apk --dir previous
          python3 - <<'PY'
          import hashlib, pathlib
          assert hashlib.sha256(pathlib.Path('previous/TgWatch.apk').read_bytes()).hexdigest() == 'efd2147dae453c12288da5b3f33840f3dfb2f6b85032411f348fabb5e8e009d1'
          PY
          signer="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$signer" verify --print-certs previous/TgWatch.apk > previous-signature.txt
          "$signer" verify --print-certs TgWatch.apk > release-signature.txt
          diff <(grep 'Signer #1 certificate SHA-256 digest:' previous-signature.txt) <(grep 'Signer #1 certificate SHA-256 digest:' release-signature.txt)
          python3 - <<'PY'
          import pathlib, re
          expected = 'ab74727a44f59684045e7db4c820be309f886433a18a3c06f3439417f3acbef1'
          for name in ('previous-signature.txt', 'release-signature.txt'):
              digests = re.findall(r'^Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]{64})$', pathlib.Path(name).read_text(), re.M)
              assert [digest.lower() for digest in digests] == [expected], 'Production signing identity mismatch'
          PY
      - name: Select and verify the latest stable published predecessor
        id: latest_baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/upgrade-baseline.py --repo "$GITHUB_REPOSITORY" \
            --out previous-latest --aapt2 "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify production signing identity of the latest predecessor
        if: steps.latest_baseline.outputs.available == 'true'
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs previous-latest/TgWatch.apk > latest-signature.txt
          grep -qx 'Signer #1 certificate SHA-256 digest: ab74727a44f59684045e7db4c820be309f886433a18a3c06f3439417f3acbef1' latest-signature.txt
          diff <(grep 'Signer #1 certificate SHA-256 digest:' latest-signature.txt) <(grep 'Signer #1 certificate SHA-256 digest:' release-signature.txt)
      - name: Enable KVM for signed upgrade
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade the real signed release without clearing data
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          # The runner executes lines in separate shells; fold one Bash command.
          # Reset only between independent paths, preserving old -> new data in each.
          script: >-
            bash -c 'set -euo pipefail;
            python3 scripts/adb-readiness.py --timeout 180;
            mkdir -p signed-upgrade/legacy signed-upgrade/latest;
            run_upgrade() {
            local reports=$1 result=0;
            shift;
            "$@" || result=$?;
            for report in signed-upgrade-logcat.txt upgrade-*.txt upgrade-*.xml upgrade-*.csv release-screen.png; do
            if [ -f "$report" ]; then mv "$report" "$reports/"; fi;
            done;
            return "$result";
            };
            run_upgrade signed-upgrade/legacy bash scripts/signed-upgrade-smoke.sh previous/TgWatch.apk TgWatch.apk;
            if [ "${{ steps.latest_baseline.outputs.available }}" = true ]; then
            adb uninstall ru.tgwatch;
            run_upgrade signed-upgrade/latest bash scripts/signed-upgrade-smoke.sh previous-latest/TgWatch.apk TgWatch.apk;
            fi'
      - name: Signed upgrade reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-upgrade-reports
          path: signed-upgrade/
      - name: Verify pristine release sources after emulator
        # This guard comes from the workflow, before any workspace validator executes.
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          untracked_list=$(mktemp)
          trap 'rm -f "$untracked_list"' EXIT
          git ls-files -v -z > "$untracked_list"
          while IFS= read -r -d '' entry; do
            case "$entry" in
              [a-z]' '*|S' '*) echo 'Unsafe Git index flags on publication sources.' >&2; exit 1 ;;
            esac
          done < "$untracked_list"
          # Compare raw blobs and index modes, independent of stat caches and Git filters.
          python3 -I - "$GITHUB_SHA" <<'PY'
          import os
          from pathlib import Path
          import stat
          import subprocess
          import sys

          def git(*args, data=None):
              return subprocess.run(['git', '--no-replace-objects', *args], input=data,
                                    capture_output=True, check=True, timeout=30).stdout

          try:
              expected = {}
              for entry in git('ls-tree', '-rz', '--full-tree', sys.argv[1]).split(b'\0'):
                  if not entry:
                      continue
                  metadata, name = entry.split(b'\t', 1)
                  mode, kind, digest = metadata.split()
                  if kind != b'blob' or mode not in (b'100644', b'100755', b'120000') or name in expected:
                      raise ValueError('Unsupported or duplicate trusted source entry')
                  expected[name] = (mode, digest)
              indexed = {}
              for entry in git('ls-files', '--stage', '-z').split(b'\0'):
                  if not entry:
                      continue
                  metadata, name = entry.split(b'\t', 1)
                  mode, digest, stage = metadata.split()
                  if stage != b'0' or name in indexed:
                      raise ValueError('Unmerged or duplicate source index entry')
                  indexed[name] = (mode, digest)
              if not expected or indexed != expected:
                  raise ValueError('Publication index differs from the trusted source tree')
              for name, (mode, digest) in expected.items():
                  path = Path(os.fsdecode(name))
                  info = path.lstat()
                  if mode == b'120000':
                      if not stat.S_ISLNK(info.st_mode):
                          raise ValueError('Publication source symlink type changed')
                      data = os.fsencode(os.readlink(path))
                  else:
                      if not stat.S_ISREG(info.st_mode) or bool(info.st_mode & stat.S_IXUSR) != (mode == b'100755'):
                          raise ValueError('Publication source file type or executable mode changed')
                      data = path.read_bytes()
                  if git('hash-object', '--no-filters', '--stdin', data=data).strip() != digest:
                      raise ValueError('Publication source bytes differ from the trusted source tree')
          except (ValueError, OSError, subprocess.SubprocessError) as error:
              print(f'Publication source integrity refused: {error}', file=sys.stderr)
              sys.exit(1)
          PY
          # Ignore rules must not hide an untrusted Python module or bytecode cache.
          git ls-files --others -z > "$untracked_list"
          while IFS= read -r -d '' path; do
            case "$path" in
              app/build/*|.gradle/*) ;;
              TgWatch.apk|TgWatch.apk.sha256|TgWatch.sbom.cdx.json|TgWatch.trivy.json|TgWatch.dependencies.json|TgWatch.osv.json) ;;
              release-evidence/TgWatch.sbom.cdx.json|release-evidence/TgWatch.trivy.json|release-evidence/TgWatch.trivy.status.json|release-evidence/TgWatch.trivy.log) ;;
              release-dependencies/resolved.json|release-dependencies/osv-report.json) ;;
              previous/TgWatch.apk|previous-latest/TgWatch.apk|previous-latest/TgWatch.apk.sha256|previous-latest/tag.txt) ;;
              previous-signature.txt|release-signature.txt|latest-signature.txt|publish-signature.txt|publish-badging.txt) ;;
              signed-upgrade/legacy/signed-upgrade-logcat.txt|signed-upgrade/latest/signed-upgrade-logcat.txt) ;;
              signed-upgrade/legacy/upgrade-before-prefs.xml|signed-upgrade/latest/upgrade-before-prefs.xml) ;;
              signed-upgrade/legacy/upgrade-seeded-prefs.xml|signed-upgrade/latest/upgrade-seeded-prefs.xml) ;;
              signed-upgrade/legacy/upgrade-before-history.csv|signed-upgrade/latest/upgrade-before-history.csv) ;;
              signed-upgrade/legacy/upgrade-after-prefs.xml|signed-upgrade/latest/upgrade-after-prefs.xml) ;;
              signed-upgrade/legacy/upgrade-after-history.csv|signed-upgrade/latest/upgrade-after-history.csv) ;;
              signed-upgrade/legacy/release-screen.png|signed-upgrade/latest/release-screen.png) ;;
              *) echo 'Unexpected untracked publication input.' >&2; exit 1 ;;
            esac
          done < "$untracked_list"
      - name: Re-verify the signed APK before publication
        # Third-party emulator steps ran in this workspace after signing: publish only the exact signed bytes.
        env:
          APK_SHA256: ${{ steps.signed.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          test -n "$APK_SHA256"
          echo "$APK_SHA256  TgWatch.apk" | sha256sum -c -
          [ "$(cut -d' ' -f1 TgWatch.apk.sha256)" = "$APK_SHA256" ]
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs TgWatch.apk > publish-signature.txt
          grep -qx 'Signer #1 certificate SHA-256 digest: ab74727a44f59684045e7db4c820be309f886433a18a3c06f3439417f3acbef1' publish-signature.txt
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" dump badging TgWatch.apk > publish-badging.txt
          python3 - <<'PY'
          import pathlib, re
          versions = [line.split('=', 1)[1] for line in pathlib.Path('version.properties').read_text().splitlines()
                      if line.startswith('version=')]
          assert len(versions) == 1, 'Missing unique source version'
          version = versions[0]
          major, minor, patch = map(int, version.split('.'))
          packages = re.findall(r'^package: (.+)$', pathlib.Path('publish-badging.txt').read_text(), re.M)
          assert len(packages) == 1, 'Missing unique APK package metadata'
          expected = {'name': 'ru.tgwatch', 'versionName': version,
                      'versionCode': str(major * 1000000 + minor * 1000 + patch)}
          for key, value in expected.items():
              assert re.findall(rf"\b{key}='([^']*)'", packages[0]) == [value], f'APK {key} mismatch'
          PY
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          untracked_list=$(mktemp)
          trap 'rm -f "$untracked_list"' EXIT
          git ls-files -v -z > "$untracked_list"
          while IFS= read -r -d '' entry; do
            case "$entry" in
              [a-z]' '*|S' '*) echo 'Unsafe Git index flags on publication sources.' >&2; exit 1 ;;
            esac
          done < "$untracked_list"
          # Compare raw blobs and index modes, independent of stat caches and Git filters.
          python3 -I - "$GITHUB_SHA" <<'PY'
          import os
          from pathlib import Path
          import stat
          import subprocess
          import sys

          def git(*args, data=None):
              return subprocess.run(['git', '--no-replace-objects', *args], input=data,
                                    capture_output=True, check=True, timeout=30).stdout

          try:
              expected = {}
              for entry in git('ls-tree', '-rz', '--full-tree', sys.argv[1]).split(b'\0'):
                  if not entry:
                      continue
                  metadata, name = entry.split(b'\t', 1)
                  mode, kind, digest = metadata.split()
                  if kind != b'blob' or mode not in (b'100644', b'100755', b'120000') or name in expected:
                      raise ValueError('Unsupported or duplicate trusted source entry')
                  expected[name] = (mode, digest)
              indexed = {}
              for entry in git('ls-files', '--stage', '-z').split(b'\0'):
                  if not entry:
                      continue
                  metadata, name = entry.split(b'\t', 1)
                  mode, digest, stage = metadata.split()
                  if stage != b'0' or name in indexed:
                      raise ValueError('Unmerged or duplicate source index entry')
                  indexed[name] = (mode, digest)
              if not expected or indexed != expected:
                  raise ValueError('Publication index differs from the trusted source tree')
              for name, (mode, digest) in expected.items():
                  path = Path(os.fsdecode(name))
                  info = path.lstat()
                  if mode == b'120000':
                      if not stat.S_ISLNK(info.st_mode):
                          raise ValueError('Publication source symlink type changed')
                      data = os.fsencode(os.readlink(path))
                  else:
                      if not stat.S_ISREG(info.st_mode) or bool(info.st_mode & stat.S_IXUSR) != (mode == b'100755'):
                          raise ValueError('Publication source file type or executable mode changed')
                      data = path.read_bytes()
                  if git('hash-object', '--no-filters', '--stdin', data=data).strip() != digest:
                      raise ValueError('Publication source bytes differ from the trusted source tree')
          except (ValueError, OSError, subprocess.SubprocessError) as error:
              print(f'Publication source integrity refused: {error}', file=sys.stderr)
              sys.exit(1)
          PY
          # Ignore rules must not hide an untrusted Python module or bytecode cache.
          git ls-files --others -z > "$untracked_list"
          while IFS= read -r -d '' path; do
            case "$path" in
              app/build/*|.gradle/*) ;;
              TgWatch.apk|TgWatch.apk.sha256|TgWatch.sbom.cdx.json|TgWatch.trivy.json|TgWatch.dependencies.json|TgWatch.osv.json) ;;
              release-evidence/TgWatch.sbom.cdx.json|release-evidence/TgWatch.trivy.json|release-evidence/TgWatch.trivy.status.json|release-evidence/TgWatch.trivy.log) ;;
              release-dependencies/resolved.json|release-dependencies/osv-report.json) ;;
              previous/TgWatch.apk|previous-latest/TgWatch.apk|previous-latest/TgWatch.apk.sha256|previous-latest/tag.txt) ;;
              previous-signature.txt|release-signature.txt|latest-signature.txt|publish-signature.txt|publish-badging.txt) ;;
              signed-upgrade/legacy/signed-upgrade-logcat.txt|signed-upgrade/latest/signed-upgrade-logcat.txt) ;;
              signed-upgrade/legacy/upgrade-before-prefs.xml|signed-upgrade/latest/upgrade-before-prefs.xml) ;;
              signed-upgrade/legacy/upgrade-seeded-prefs.xml|signed-upgrade/latest/upgrade-seeded-prefs.xml) ;;
              signed-upgrade/legacy/upgrade-before-history.csv|signed-upgrade/latest/upgrade-before-history.csv) ;;
              signed-upgrade/legacy/upgrade-after-prefs.xml|signed-upgrade/latest/upgrade-after-prefs.xml) ;;
              signed-upgrade/legacy/upgrade-after-history.csv|signed-upgrade/latest/upgrade-after-history.csv) ;;
              signed-upgrade/legacy/release-screen.png|signed-upgrade/latest/release-screen.png) ;;
              *) echo 'Unexpected untracked publication input.' >&2; exit 1 ;;
            esac
          done < "$untracked_list"
          version=$(sed -n 's/^version=//p' version.properties)
          python3 scripts/release-policy.py --repo "$GITHUB_REPOSITORY" \
            --sha "$(git rev-parse HEAD)" --ref "$GITHUB_REF" \
            --apksigner "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
            --aapt2 "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2" \
            --notes "docs/releases/${version}.md" \
            --assets TgWatch.apk TgWatch.apk.sha256 TgWatch.sbom.cdx.json TgWatch.trivy.json TgWatch.dependencies.json TgWatch.osv.json
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: tgwatch-check-android-${{ matrix.api }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash scripts/android-smoke.sh
      - name: Connected Android test summary and bounded failure annotations
        if: always()
        run: python3 scripts/report-android-tests.py app/build/outputs/androidTest-results/connected
      - name: Android reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/connected/
            smoke-logcat.txt
