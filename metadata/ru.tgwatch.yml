AutoName: TgWatch
Summary: Private reachability monitor for Telegram, Matrix and HTTPS services
# Store text is maintained in fastlane/metadata/android/{en-US,ru-RU}; keep this summary in sync.
Description: |-
  TgWatch checks Telegram, optional independent Matrix, WhatsApp Web and custom
  HTTPS services with separate local history and alerts. It supports English and
  Russian, encrypted portable backups, latency trends, configurable widgets and
  explicit redacted status sharing. Optional automation and HTTPS text/JSON
  webhooks start disabled. Addresses and credentials stay outside portable backups
  and diagnostic exports. No account, author server or telemetry is needed.

